# CrossServerTP template for smp_01
# Official paired layout with smp_02 using 60,000-block worlds:
#   smp_01 Chunky/worldborder center-x = 30000.5
#   smp_01 Chunky/worldborder center-z = 0.5
#   radius = 30000, shape = square
# Result:
#   X range = 0.5 -> 60000.5
#   Z range = -29999.5 -> 30000.5
# Border handoff:
#   smp_01 EAST 60000 -> smp_02 WEST 60000 -> arrive near X=60005

server-name: "smp_01"

redis:
  enabled: true
  host: "5.9.152.50" # must point to the writable Redis primary/master, not a read-only replica
  port: 6379
  password: ""
  database: 0
  key-prefix: "crossservertp:"
  async-threads: 2
  async-queue-capacity: 256
  status-cache-ttl-ms: 3000
  transfer-timeout-ms: 3000
  pool:
    max-total: 8
    max-idle: 8
    min-idle: 1
  timeout:
    connection: 2000
  reconnect:
    max-retries: 2
    initial-delay-ms: 250

check-interval-ticks: 20
unsafe-destination-block-clearing:
  enabled: false
particle-view-distance: 50
particle-type: FLAME

borders:
  east-to-smp_02:
    world: world
    side: EAST
    coordinate: 60000
    target-server: smp_02
    target-world: world
    target-side: WEST
    target-coordinate: 60000
    target-offset: 5
    show-particles: true
# Optional safety edge on the west side
#  west-soft-cap:
#    world: world
#    side: WEST
#    coordinate: 0
#    target-server: smp_01
#    show-particles: true

entity-teleportation:
  enabled: true
  teleport-vehicles: true
  teleport-leashed-mobs: true
  teleport-nearby-villagers: true
  nearby-entity-distance: 3
  max-entities: 10
  mobs_must_be_leashed: false
  mobs:
    exclusion: true
    list:
      - WITHER
      - ENDER_DRAGON
  vehicles:
    exclusion: true
    list: []

messages:
  server-offline: "&cThe destination server is currently offline. Please try again later."
